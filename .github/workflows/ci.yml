name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Accepts SDK licenses so AGP can download the compileSdk platform (37.2) on demand.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the legacy 'tools' package, which no longer exists.
          packages: platform-tools

      # Also validates the Gradle wrapper jar and caches Gradle downloads.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :securekeys:testDebugUnitTest

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :securekeys:lintDebug

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            securekeys/build/reports/
            securekeys/build/test-results/
          if-no-files-found: ignore
