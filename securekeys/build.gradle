apply plugin: 'com.android.application'

android {
    
    compileSdkVersion 23
    buildToolsVersion '23.0.3'
    defaultConfig {
        applicationId "com.dexetra.securekeys"
        minSdkVersion 8
        targetSdkVersion 23
        versionCode 1
        versionName "3.0"
    }
    File signFile = rootProject.file('secure_keystore.properties')
    if (signFile.exists()) {
        Properties properties = new Properties()
        properties.load(new FileInputStream(signFile))
        signingConfigs {
            release {
                storeFile rootProject.file(properties['STORE_FILE'])
                storePassword properties['STORE_PASSWORD']
                keyAlias properties['KEY_ALIAS']
                keyPassword properties['KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }

        if (signFile.exists())
            release {
                //runProguard false
                //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
                signingConfig signingConfigs.release
            }
        if (signFile.exists())
            releaseDebuggable {
                debuggable true
                signingConfig signingConfigs.release
            }

    }
    applicationVariants.all { variant ->
        if (variant.buildType.name.equals("releaseDebuggable")) {
            variant.outputs.each { output ->
                output.outputFile = new File(output.outputFile.parent, "secure_playstore_debuggable.apk");
            }
        } else if (variant.buildType.name.equals("release")) {
            variant.outputs.each { output ->
                output.outputFile = new File(output.outputFile.parent, "secure_playstore.apk");
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    productFlavors {
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile 'com.android.support:support-v4:23.1.1'
    compile 'com.android.support:appcompat-v7:23.1.1'
    compile project(':SecureKeysLib')
}
